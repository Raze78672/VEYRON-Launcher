name: VEYRON Android launcher build

on:
  push:
    branches: [ main, launcher-development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VEYRON and Mojo source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Apply VEYRON branding to the pinned Mojo source
        run: python3 scripts/prepare_veyron_mojo.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Build VEYRON debug APK
        run: gradle :app:assembleFullDebug

      - name: Upload VEYRON debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VEYRON-Launcher-Mojo-based-debug
          path: vendor/mojolauncher/app_mojo/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
